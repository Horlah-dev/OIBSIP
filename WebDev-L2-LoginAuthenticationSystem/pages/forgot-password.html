<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password NOVA</title>
    <link rel="stylesheet" href="../index.css">
</head>
<body>
    <section class="login-container">
        <div class="login-info">
            <h1>NOVA</h1>
            <h3>Reset Your Password</h3>
            <p>Enter your email address and create a new password to regain access to your account.</p>
        </div>

        <div class="login-card">
            <h2>Forgot Password?</h2>
            <p>Reset your password below.</p>
            <form class="login-form" id="forgotPasswordForm">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="Enter your email">

                <span id="emailError"></span>

                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" required placeholder="Enter your new password">

                <span id="newPasswordError"></span>

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password=" id="confirmPassword" required placeholder="Confirm your new password">

                <span id="confirmPasswordError"></span>

                <button type="submit">Reset Password</button>

                <p class="register">Remember your password?<a href="login.html">Back to Login</a></p>
                <span id="resetSuccess"></span>
            </form>
        </div>
    </section>

    <script src="../index.js"></script>

</body>

</html>
